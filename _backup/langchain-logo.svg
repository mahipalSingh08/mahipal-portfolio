<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Parrot body -->
  <ellipse cx="18" cy="24" rx="12" ry="14" fill="#4CAF50"/>
  <!-- Parrot wing -->
  <ellipse cx="20" cy="26" rx="8" ry="10" fill="#66BB6A"/>
  <!-- Parrot head -->
  <circle cx="14" cy="14" r="8" fill="#4CAF50"/>
  <!-- Parrot eye -->
  <circle cx="12" cy="12" r="2" fill="#fff"/>
  <circle cx="12" cy="12" r="1" fill="#000"/>
  <!-- Parrot beak -->
  <path d="M6 14 L2 16 L6 18 Z" fill="#FF9800"/>
  <!-- Parrot belly -->
  <ellipse cx="18" cy="28" rx="6" ry="8" fill="#FFEB3B"/>
  
  <!-- Chain links -->
  <g fill="none" stroke="#78909C" stroke-width="2.5">
    <!-- First chain link -->
    <ellipse cx="38" cy="18" rx="5" ry="8"/>
    <!-- Second chain link -->
    <ellipse cx="38" cy="30" rx="5" ry="8"/>
  </g>
</svg>