<canvas #bgCanvas id="bg-canvas"></canvas>

<section id="hero">
  <div class="hero-content">
    <div class="hero-text-side">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        ✨ Open to AI collaborations
      </div>
      <h1 class="hero-name">
        <span class="line">Mahipal</span>
        <span class="line accent-line">Singh</span>
      </h1>
      <div class="hero-typing">
        <span class="typing-text">{{ typingText() }}</span><span class="typing-cursor">|</span>
      </div>
      <p class="hero-title">{{ heroTitleText() }}</p>
      <p class="hero-tagline">"Building intelligent systems powered by AI"</p>
      <div class="hero-bottom-row">
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary">View Projects</a>
          <a href="#contact" class="btn btn-ghost">Contact Me</a>
        </div>
        <div class="hero-stats">
          <div class="stat"><span class="stat-num">10+</span><span class="stat-label">Years Exp</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-num">4</span><span class="stat-label">Companies</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-num">10+</span><span class="stat-label">Certifications</span></div>
        </div>
      </div>
    </div>
    @if (!isMobile()) {
    <div class="hero-visual" #orbitContainer>
      <div class="orbit-system" #orbitSystem>
        <!-- Radial glow behind orbits -->
        <div class="orbit-glow"></div>

        <!-- Orbit 3 – innermost, fastest -->
        <!-- <div class="orbit orbit-3">
            <div class="orbit-dot od8" data-tooltip="Ollama">
              <img src="assets/ollama.png" alt="Ollama"/>
            </div>
            <div class="orbit-dot od9" data-tooltip="MCP">
              <img src="assets/mcp.png" alt="MCP"/>
            </div>
          </div> -->

        <!-- Orbit 1 – middle -->
        <div class="orbit orbit-1">
          <div class="orbit-dot od1" data-tooltip="Python">
            <img src="assets/python.png" alt="Python" />
          </div>
          <div class="orbit-dot od2" data-tooltip="FastAPI">
            <img src="assets/fastapi.png" alt="FastAPI" />
          </div>
          <div class="orbit-dot od3" data-tooltip="Qdrant">
            <img src="assets/qdrant.png" alt="Qdrant" />
          </div>
        </div>

        <!-- Orbit 2 – outermost, slowest -->
        <div class="orbit orbit-2">
          <div class="orbit-dot od4" data-tooltip="OpenAI">
            <img src="assets/openai.png" alt="OpenAI" />
          </div>
          <div class="orbit-dot od5" data-tooltip="Gemini">
            <img src="assets/gemini.png" alt="Gemini" />
          </div>
          <div class="orbit-dot od6" data-tooltip="Deepseek">
            <img src="assets/deepseek.png" alt="Deepseek" />
          </div>
          <div class="orbit-dot od7" data-tooltip="Claude">
            <img src="assets/claude.png" alt="Claude" />
          </div>
        </div>

        <!-- Core AI element -->
        <div class="core">
          <div class="core-ring"></div>
          <div class="core-ring ring-2"></div>
          <div class="core-inner" #coreText>AI</div>
          <div class="core-glow-ripple"></div>
        </div>
      </div>
    </div>
    }
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator">
    <span class="scroll-text">Scroll</span>
    <div class="scroll-arrow">
      <svg width="16" height="24" viewBox="0 0 16 24" fill="none">
        <rect x="1" y="1" width="14" height="22" rx="7" stroke="currentColor" stroke-width="2" />
        <circle cx="8" cy="8" r="2" fill="currentColor" class="scroll-dot" />
      </svg>
    </div>
  </div>
</section>
