<canvas #bgCanvas id="bg-canvas"></canvas>

<section id="hero">
  <div class="hero-content">
    <div class="hero-text-side">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        Available for AI projects
      </div>
      <h1 class="hero-name">
        <span class="line">Mahipal</span>
        <span class="line accent-line">Singh</span>
      </h1>
      <div class="hero-typing">
        <span class="typing-text">{{ typingText() }}</span><span class="typing-cursor">|</span>
      </div>
      <p class="hero-title">{{ heroTitleText() }}</p>
      <p class="hero-tagline">"Building intelligent systems powered by AI"</p>
      <div class="hero-bottom-row">
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary">View Projects</a>
          <a href="#contact" class="btn btn-ghost">Contact Me</a>
        </div>
        <div class="hero-stats">
          <div class="stat"><span class="stat-num">10+</span><span class="stat-label">Years Exp</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-num">4</span><span class="stat-label">Companies</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-num">4</span><span class="stat-label">Certifications</span></div>
        </div>
      </div>
    </div>
    <div class="hero-visual">
      <div class="orbit-system">
        <div class="orbit orbit-1">
          <div class="orbit-dot od1" data-tooltip="OpenAI">
            <svg viewBox="0 0 24 24" fill="#ffffff">
              <path
                d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z" />
            </svg>
          </div>
          <div class="orbit-dot od2" data-tooltip="Gemini">
            <svg viewBox="0 0 24 24">
              <defs>
                <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#4285F4" />
                  <stop offset="25%" stop-color="#9B72CB" />
                  <stop offset="50%" stop-color="#D96570" />
                  <stop offset="75%" stop-color="#D96570" />
                  <stop offset="100%" stop-color="#9B72CB" />
                </linearGradient>
              </defs>
              <path fill="url(#geminiGrad)"
                d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z" />
            </svg>
          </div>
          <div class="orbit-dot od3" data-tooltip="Claude">
            <svg viewBox="0 0 24 24" fill="#D4A27F">
              <path
                d="M12 2L12.9 6.1L15.5 3.2L14.2 7.2L18.3 6.1L15.4 8.7L19.5 9.6L15.4 10.5L18.3 13.1L14.2 12L15.5 16L12.9 13.1L12 17.2L11.1 13.1L8.5 16L9.8 12L5.7 13.1L8.6 10.5L4.5 9.6L8.6 8.7L5.7 6.1L9.8 7.2L8.5 3.2L11.1 6.1L12 2z" />
            </svg>
          </div>
        </div>
        <div class="orbit orbit-2">
          <div class="orbit-dot od4" data-tooltip="LangChain">
            <img src="assets/langchain-logo.svg" alt="LangChain" />
          </div>
          <div class="orbit-dot od5" data-tooltip="Ollama">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"
              stroke-linejoin="round">
              <ellipse cx="12" cy="13" rx="7" ry="6" />
              <ellipse cx="12" cy="9" rx="5" ry="4" />
              <circle cx="9.5" cy="8.5" r="0.5" fill="#ffffff" />
              <circle cx="14.5" cy="8.5" r="0.5" fill="#ffffff" />
              <path d="M10.5 11c.5.5 2.5.5 3 0" />
              <path d="M8 6c-1-2 0-4 2-4M16 6c1-2 0-4-2-4" />
            </svg>
          </div>
          <div class="orbit-dot od6" data-tooltip="Python">
            <svg viewBox="0 0 24 24">
              <path fill="#3776AB"
                d="M11.914 0C5.82 0 6.2 2.656 6.2 2.656l.007 2.752h5.814v.826H3.9S0 5.789 0 11.969c0 6.18 3.403 5.96 3.403 5.96h2.03v-2.867s-.109-3.42 3.35-3.42h5.766s3.24.052 3.24-3.148V3.202S18.28 0 11.914 0zM8.708 1.85c.578 0 1.046.47 1.046 1.052 0 .58-.468 1.051-1.046 1.051-.579 0-1.046-.47-1.046-1.051 0-.581.467-1.052 1.046-1.052z" />
              <path fill="#FFC331"
                d="M12.086 24c6.094 0 5.714-2.656 5.714-2.656l-.007-2.752h-5.814v-.826h8.121s3.9.445 3.9-5.735c0-6.18-3.403-5.96-3.403-5.96h-2.03v2.867s.109 3.42-3.35 3.42H9.451s-3.24-.052-3.24 3.148v5.292S5.72 24 12.086 24zm3.206-1.85c-.578 0-1.046-.47-1.046-1.052 0-.58.468-1.051 1.046-1.051.579 0 1.046.47 1.046 1.051 0 .581-.467 1.052-1.046 1.052z" />
            </svg>
          </div>
        </div>
        <div class="core">
          <div class="core-inner">AI</div>
        </div>
      </div>
    </div>
  </div>
</section>
