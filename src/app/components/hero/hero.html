<canvas #bgCanvas id="bg-canvas"></canvas>

<section id="hero">
  <div class="hero-content">
    <div class="hero-text-side">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        Available for AI projects
      </div>
      <h1 class="hero-name">
        <span class="line">Mahipal</span>
        <span class="line accent-line">Singh</span>
      </h1>
      <div class="hero-typing">
        <span class="typing-text">{{ typingText() }}</span><span class="typing-cursor">|</span>
      </div>
      <p class="hero-title">{{ heroTitleText() }}</p>
      <p class="hero-tagline">"Building intelligent systems powered by AI"</p>
      <div class="hero-bottom-row">
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary">View Projects</a>
          <a href="#contact" class="btn btn-ghost">Contact Me</a>
        </div>
        <div class="hero-stats">
          <div class="stat"><span class="stat-num">10+</span><span class="stat-label">Years Exp</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-num">4</span><span class="stat-label">Companies</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-num">6</span><span class="stat-label">Certifications</span></div>
        </div>
      </div>
    </div>
    @if (!isMobile()) {
      <div class="hero-visual" id="hero-visual-3d">
        <div class="orbit-3d-container" id="orbit3d">
          <!-- Floating particles background -->
          <div class="orbital-particles">
            @for (p of orbitalParticles; track p.id) {
              <div
                class="orb-particle"
                [style.--px]="p.x + 'px'"
                [style.--py]="p.y + 'px'"
                [style.--pz]="p.z + 'px'"
                [style.--ps]="p.size + 'px'"
                [style.--po]="p.opacity"
                [style.--pd]="p.delay + 's'"
                [style.--pdur]="p.duration + 's'"
              ></div>
            }
          </div>

          <!-- 3D Scene -->
          <div class="scene-3d" #scene3d>
          <!-- Orbit Ring 1 (inner, horizontal) -->
            <div class="orbit-ring orbit-ring-1">
              <div class="orbit-dot od1" data-tooltip="Python">
                <img src="/assets/python.png" alt="Python" />
              </div>
              <div class="orbit-dot od2" data-tooltip="FastAPI">
                <img src="/assets/fastapi.png" alt="FastAPI" />
              </div>
              <div class="orbit-dot od3" data-tooltip="Qdrant">
                <img src="/assets/qdrant.png" alt="Qdrant" />
              </div>
            </div>

            <!-- Orbit Ring 2 (outer, vertical) -->
            <div class="orbit-ring orbit-ring-2">
              <div class="orbit-dot od4" data-tooltip="OpenAI">
                <img src="/assets/openai.png" alt="OpenAI" />
              </div>
              <div class="orbit-dot od5" data-tooltip="Gemini">
                <img src="/assets/gemini.png" alt="Gemini" />
              </div>
              <div class="orbit-dot od6" data-tooltip="Deepseek">
                <img src="/assets/deepseek.png" alt="Deepseek" />
              </div>
              <div class="orbit-dot od7" data-tooltip="Claude">
                <img src="/assets/claude.png" alt="Claude" />
              </div>
            </div>

            <!-- Orbit Ring 3 (tilted) -->
            <div class="orbit-ring orbit-ring-3">
              <div class="orbit-dot od8" data-tooltip="LangChain">
                <img src="/assets/langchain.png" alt="LangChain" />
              </div>
              <div class="orbit-dot od9" data-tooltip="PyTorch">
                <img src="/assets/python.png" alt="PyTorch" />
              </div>
              <div class="orbit-dot od10" data-tooltip="Docker">
                <img src="/assets/Docker.png" alt="Docker" />
              </div>
            </div>

            <!-- Core AI -->
            <div class="core-3d">
              <div class="core-ring core-ring-1"></div>
              <div class="core-ring core-ring-2"></div>
              <div class="core-ring core-ring-3"></div>
              <div class="core-sphere">
                <div class="core-inner">AI</div>
              </div>
            </div>
          </div>

          <!-- Glow backdrop -->
          <div class="orbit-glow"></div>
        </div>
      </div>
    }
  </div>
</section>
