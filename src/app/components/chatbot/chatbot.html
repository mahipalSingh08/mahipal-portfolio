<!-- Floating chatbot button -->
<button
  class="chatbot-fab"
  (click)="toggleChat()"
  [class.open]="isOpen()"
  [class.show-chatbot]="showChatbot()"
  [attr.aria-label]="isOpen() ? 'Close chat' : 'Open chat'"
>
  @if (isOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  } @else {
    <img src="assets/robot.png" alt="Chatbot" class="fab-icon" />
  }
</button>

<!-- Chat modal overlay -->
@if (isOpen()) {
  <div class="chatbot-overlay" (click)="toggleChat()"></div>
}

<!-- Chat modal -->
<div class="chatbot-modal" [class.open]="isOpen()">
  <!-- Header -->
  <div class="chatbot-header">
    <div class="chatbot-header-avatar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      </svg>
    </div>
    <div class="chatbot-header-info">
      <span class="chatbot-header-name">Virtual Mahipal Singh</span>
      <span class="chatbot-header-status">Online</span>
    </div>
    <div class="chatbot-header-actions">
      <button class="chatbot-reset-btn" (click)="resetConversation()" aria-label="New conversation" title="New conversation">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
      </button>
      <button class="chatbot-close-btn" (click)="toggleChat()" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chatbot-messages" #chatMessages>
    @for (message of messages(); track trackByFn($index, message)) {
      <div
        class="chat-message"
        [class.user-message]="message.role === 'user'"
        [class.ai-message]="message.role === 'ai'"
      >
        @if (message.role === 'ai') {
          <div class="message-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            </svg>
          </div>
        }
        <div class="message-bubble">
          <div class="message-content">{{ message.content }}</div>
        </div>
      </div>
    }

    <!-- Typing indicator -->
    @if (isLoading()) {
      <div class="chat-message ai-message">
        <div class="message-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          </svg>
        </div>
        <div class="message-bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    }

    <!-- Suggested prompts (only show before first user message) -->
    @if (messages().length === 1 && !isLoading()) {
      <div class="suggested-prompts">
        @for (prompt of suggestedPrompts; track prompt.text) {
          <button class="prompt-chip" (click)="selectPrompt(prompt)">
            {{ prompt.label }}
          </button>
        }
      </div>
    }
  </div>

  <!-- Input area -->
  <div class="chatbot-input-area">
    <div class="chatbot-input-wrapper">
      <textarea
        #messageInput
        class="chatbot-input"
        placeholder="Type a message..."
        [ngModel]="inputText()"
        (ngModelChange)="inputText.set($event)"
        (keydown)="onKeyDown($event)"
        rows="1"
        [disabled]="isLoading()"
      ></textarea>
      <button
        class="chatbot-send-btn"
        (click)="sendMessage()"
        [disabled]="!inputText().trim() || isLoading()"
        aria-label="Send message"
      >
        @if (isLoading()) {
          <div class="send-spinner"></div>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        }
      </button>
    </div>
  </div>
</div>
