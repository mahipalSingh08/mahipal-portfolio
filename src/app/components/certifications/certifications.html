<section id="certifications">
  <div class="container">
    <div class="section-label" appReveal>05 — Certifications</div>
    <h2 class="section-heading" appReveal>Credentials & <em>Learning</em></h2>

    <div class="filter-buttons" appReveal>
      @for (provider of providers; track provider) {
        <button class="filter-btn" [class.active]="selectedProviders.includes(provider)" (click)="toggleProvider(provider)">{{ provider }}</button>
      }
    </div>

    <div class="certs-grid">
      @for (cert of filteredCertificates; track cert.link) {
      <a [href]="cert.link" target="_blank"
        data-tooltip="Click to view certificate" class="cert-card glass-card" appReveal [delay]="cert.delay">
        <div class="cert-icon">{{ cert.icon }}</div>
        <div class="cert-body">
          <div class="cert-title">{{ cert.title }}</div>
          <div class="cert-sub">{{ cert.sub }}</div>
        </div>
        <div class="cert-actions">
          <img [src]="cert.logo" [alt]="cert.alt" class="cert-provider-logo" />
          <div class="cert-badge">Verified</div>
        </div>
      </a>
      }
    </div>
  </div>
</section>
