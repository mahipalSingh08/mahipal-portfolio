<section id="contact">
  <div class="container">
    <div class="section-label" appReveal>06 &mdash; Contact</div>
    <h2 class="section-heading" appReveal>Let's <em>Connect</em></h2>
    <p class="contact-sub" appReveal>Open to AI engineering roles, freelance projects, and collaborations.</p>
    <div class="contact-layout" appReveal>
      @if (!isBackendReady()) {
      <div class="contact-links">
        <a href="mailto:msmahi14&#64;gmail.com" class="contact-link glass-card">
          <img src="/assets/gmail.png" alt="Gmail logo" class="contact-link-logo" />
          <div>
            <div class="contact-link-label">Email</div>
            <div class="contact-link-value">msmahi14&#64;gmail.com</div>
          </div>
          <span class="contact-arrow">&rarr;</span>
        </a>
        <a href="https://www.linkedin.com/in/mahipalsingh08" target="_blank" class="contact-link glass-card">
          <img src="/assets/linkedin.png" alt="LinkedIn logo" class="contact-link-logo" />
          <div>
            <div class="contact-link-label">LinkedIn</div>
            <div class="contact-link-value">mahipalsingh08</div>
          </div>
          <span class="contact-arrow">&rarr;</span>
        </a>
        <a href="https://github.com/mahipalSingh08" target="_blank" class="contact-link glass-card">
          <img src="/assets/GitHub.png" alt="GitHub logo" class="contact-link-logo" />
          <div>
            <div class="contact-link-label">GitHub</div>
            <div class="contact-link-value">mahipalSingh08</div>
          </div>
          <span class="contact-arrow">&rarr;</span>
        </a>

        <a href="tel:+919637628925" class="contact-link glass-card">
          <span class="contact-link-icon">&#128241;</span>
          <div>
            <div class="contact-link-label">Phone</div>
            <div class="contact-link-value">+91-9637628925</div>
          </div>
          <span class="contact-arrow">&rarr;</span>
        </a>
      </div>
      } @else {
      <form class="contact-form glass-card" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="contact-name">Name</label>
          <input id="contact-name" type="text" formControlName="name" placeholder="Your name" minlength="3"
            maxlength="100" />
        </div>
        <div class="form-group">
          <label for="contact-email">Email</label>
          <input id="contact-email" type="email" formControlName="email" placeholder="your@email.com" maxlength="100" />
        </div>
        <div class="form-group">
          <label for="contact-query">Message</label>
          <textarea id="contact-query" rows="4" formControlName="query" minlength="10" maxlength="1000"
            placeholder="Tell me about your queries..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary form-submit"
          [disabled]="submitStatus() === 'loading' || submitStatus() === 'success'"
          [class.btn-error]="submitStatus() === 'error'" [class.btn-success]="submitStatus() === 'success'">
          {{ submitText() }}
        </button>
      </form>
      <div class="form-contact-links" aria-label="Contact me">
        <a href="mailto:msmahi14&#64;gmail.com" class="form-contact-link" aria-label="Email me">
          <img src="/assets/gmail.png" alt="" />
        </a>
        <a href="https://www.linkedin.com/in/mahipalsingh08" target="_blank" class="form-contact-link"
          aria-label="Connect on LinkedIn">
          <img src="/assets/linkedin.png" alt="" />
        </a>
        <a href="https://github.com/mahipalSingh08" target="_blank" class="form-contact-link"
          aria-label="View GitHub profile">
          <img src="/assets/GitHub.png" alt="" />
        </a>
      </div>
      }
      <h3 style="text-align: center; margin-top: 10px">Like my work? Give a reaction...
      </h3>
      <div class="reaction-bar">
        <button class="reaction-btn" data-label="Like" (click)="onReactionClick($event, 'Like')">👍</button>
        <button class="reaction-btn" data-label="Cheer" (click)="onReactionClick($event, 'Cheer')">👏🏻</button>
        <button class="reaction-btn" data-label="Celebrate" (click)="onReactionClick($event, 'Celebrate')">🎉</button>
        <button class="reaction-btn" data-label="Appreciate" (click)="onReactionClick($event, 'Appreciate')">✨</button>
        <button class="reaction-btn" data-label="Smile" (click)="onReactionClick($event, 'Smile')">🙂</button>
      </div>
    </div>
  </div>
</section>
